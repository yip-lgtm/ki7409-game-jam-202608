# ====================================================================
# GitHub Pages — 自動 deploy src/ 子目錄
# ====================================================================

name: Deploy src/ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage portraits into src/
        run: |
          mkdir -p src/assets/portraits
          if [ -f design/characters/image.png ]; then
            cp design/characters/image.png src/assets/portraits/tomori.png
            cp design/characters/image.png src/assets/portraits/neutral.png
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (only src/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
